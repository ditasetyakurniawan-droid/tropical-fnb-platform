sonar.projectKey=tropical-fnb-platform
sonar.projectName=Tropical F&B Platform
sonar.sourceEncoding=UTF-8

# Source and Test directories
sonar.sources=backend/internal,backend/cmd,frontend/src
sonar.tests=backend/internal,frontend/src
sonar.test.inclusions=backend/**/*_test.go,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.exclusions=backend/**/*_test.go,frontend/src/**/*.test.*,**/node_modules/**,**/dist/**,**/.git/**,**/coverage/**,**/vendor/**

# Exclude non-business / test / build code from coverage metrics
sonar.coverage.exclusions=backend/**/*_test.go,backend/cmd/**,backend/migrations/**,frontend/src/**/*.test.*,frontend/src/main.tsx,frontend/src/vite-env.d.ts

# Go unit test & code coverage report paths
sonar.go.coverage.reportPaths=backend/coverage.sonar.out
sonar.go.tests.reportPaths=backend/go-test.json

# Frontend (Vitest) lcov coverage report path
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Exclude tests and fixtures from duplicate detection
sonar.cpd.exclusions=backend/**/*_test.go,frontend/src/**/*.test.*
