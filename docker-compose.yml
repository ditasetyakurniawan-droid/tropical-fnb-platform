# Local development services only. Production runs on your Kubernetes cluster
# via the Helm chart in deploy/helm/tropical-fnb.
name: tropical-fnb

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tropical}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tropical_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tropical_fnb}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql (versioned subdir).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
